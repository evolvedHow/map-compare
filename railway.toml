# map-compare AI Analysis Backend — Railway deployment config
#
# Service setup in Railway dashboard:
#   1. New service → "Deploy from GitHub repo"
#   2. Root directory: map-compare
#   3. Railway auto-detects this railway.toml
#
# Required environment variables:
#   AI_PROVIDER   groq | anthropic | openai | google   (default: groq)
#   AI_API_KEY    API key for the chosen provider
#
# After deploy:
#   - Copy the Railway service URL
#   - Set VITE_ANALYZE_API_URL=https://<service>.up.railway.app in your Vite build env
#   - Rebuild the frontend and redeploy to GitHub Pages

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# ${PORT:-8005}, not $PORT. Railway injects PORT only once the service has a
# public domain, and this startCommand overrides the Dockerfile CMD — so on a
# domain-less deploy the bare form expanded to "--port " and uvicorn exited
# instantly with "Option '--port' requires an argument". The container died
# before logging anything, so the only visible symptom was the healthcheck
# reporting "service unavailable".
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8005}"
healthcheckPath = "/api/health"
# litellm's import alone is ~5s locally and slower on a cold shared builder;
# 30s left very little headroom.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
