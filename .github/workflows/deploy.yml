name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # VITE_ANALYZE_API_URL is the Railway backend the static site POSTs
      # /api/analyze to. It is a public URL, not a secret, so it lives in
      # Actions *variables* — set it under Settings → Secrets and variables →
      # Actions → Variables. No AI key belongs here: a static build cannot
      # keep one, so the key stays on the Railway service.
      - run: npm run build
        env:
          VITE_ANALYZE_API_URL: ${{ vars.VITE_ANALYZE_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
